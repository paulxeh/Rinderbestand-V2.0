# Veröffentlicht die aktuelle Version als echte App auf Firebase Hosting.
# Startet NUR per Hand: GitHub -> Actions -> "Echte App veröffentlichen" -> "Run workflow".
# Benötigt einmalig:
#   - Secret   FIREBASE_SERVICE_ACCOUNT  (Inhalt der JSON-Schlüsseldatei)
#   (optional) Variable FIREBASE_PROJECT_ID – sonst wird die Projekt-ID aus dem Schlüssel genommen
name: Echte App veröffentlichen

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Einstellungen prüfen
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID_VAR: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Das Secret FIREBASE_SERVICE_ACCOUNT fehlt oder ist leer."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 - "$RUNNER_TEMP/sa.json" "$PID_VAR" <<'PY'
          import json, os, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              print("::error::Das Secret FIREBASE_SERVICE_ACCOUNT ist kein gültiger JSON-Schlüssel (bitte den kompletten Dateiinhalt einfügen).")
              sys.exit(1)
          key_project = (d.get("project_id") or "").strip()
          var_project = (sys.argv[2] or "").strip()
          project = var_project or key_project
          if not project:
              print("::error::Im Schlüssel steht keine Projekt-ID.")
              sys.exit(1)
          if var_project and key_project and var_project != key_project:
              print(f"::error::Projekt-ID passt nicht: Variable '{var_project}', Schlüssel '{key_project}'. Variable löschen oder korrigieren.")
              sys.exit(1)
          print(f"::notice::Veröffentliche in Firebase-Projekt '{project}' (Dienstkonto {d.get('client_email', '?')}).")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PID={project}\n")
          PY

      - name: Zu Firebase hochladen
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          if ! npx --yes firebase-tools@latest deploy --only hosting --project "$PID" --non-interactive 2>&1 | tee "$RUNNER_TEMP/out.log"; then
            grep -iE "error|denied|permission|not found|forbidden|HTTP|requires|enable" "$RUNNER_TEMP/out.log" | grep -v "private_key" | tail -12 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -iE "Hosting URL" "$RUNNER_TEMP/out.log" | while IFS= read -r line; do echo "::notice::$line"; done

      - name: Schlüssel-Datei löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
