# Veröffentlicht die aktuelle Version als echte App auf Firebase Hosting.
# Startet NUR per Hand: GitHub -> Actions -> "Echte App veröffentlichen" -> "Run workflow".
# Benötigt einmalig:
#   - Secret   FIREBASE_SERVICE_ACCOUNT  (Inhalt der JSON-Schlüsseldatei)
#   - Variable FIREBASE_PROJECT_ID       (z. B. rinderbestand-a1b2c)
name: Echte App veröffentlichen

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Einstellungen prüfen
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Das Secret FIREBASE_SERVICE_ACCOUNT fehlt oder ist leer."; exit 1; fi
          if [ -z "$PID" ]; then echo "::error::Die Variable FIREBASE_PROJECT_ID fehlt oder ist leer (Settings -> Secrets and variables -> Actions -> Variables)."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 - "$RUNNER_TEMP/sa.json" "$PID" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print("::error::Das Secret FIREBASE_SERVICE_ACCOUNT ist kein gültiger JSON-Schlüssel (bitte den kompletten Dateiinhalt einfügen).")
              sys.exit(1)
          key_project = d.get("project_id", "")
          print(f"::notice::Schlüssel gehört zu Projekt '{key_project}', Dienstkonto {d.get('client_email', '?')}. Variable FIREBASE_PROJECT_ID = '{sys.argv[2]}'.")
          if key_project and key_project != sys.argv[2].strip():
              print(f"::error::Projekt-ID passt nicht: Variable '{sys.argv[2]}', Schlüssel '{key_project}'.")
              sys.exit(1)
          PY

      - name: Zu Firebase hochladen
        env:
          PID: ${{ vars.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          if ! npx --yes firebase-tools@latest deploy --only hosting --project "$PID" --non-interactive 2>&1 | tee "$RUNNER_TEMP/out.log"; then
            grep -iE "error|denied|permission|not found|forbidden|HTTP|requires|enable" "$RUNNER_TEMP/out.log" | grep -v "private_key" | tail -12 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          grep -iE "Hosting URL" "$RUNNER_TEMP/out.log" | while IFS= read -r line; do echo "::notice::$line"; done

      - name: Schlüssel-Datei löschen
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
